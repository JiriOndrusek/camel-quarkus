name: ctg_with_haproxy
services:
  ctg:
    image: "images.paas.redhat.com/fuseqe/ibm-cicstg-container-linux-x86-trial:9.3"
    volumes:
      - "${CTG_INI_FILE}:/var/cicscli/ctg.ini"
      - "${SERVER_KEYSTORE_FILE}:/home/ctg/config/server.keystore"
    environment:
      LICENSE: "accept"
    networks:
      ctg_network:
        aliases:
          - "ctg"
  haproxy:
    image: "haproxytech/haproxy-alpine:latest"
    volumes:
      - "${HAPROXY_CFG_FILE}:/usr/local/etc/haproxy/haproxy.cfg"
    networks:
      ctg_network:
        aliases:
          - "haproxy"
    depends_on:
      - ctg
networks:
  ctg_network: