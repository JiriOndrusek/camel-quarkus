# the datasource (sync ledger) is provided by Dev Services in dev/test and by the
# quarkus.datasource.* configuration in production
ingest.test.directory=target/ingest-docs
ingest.test.sync-directory=target/ingest-sync-docs

# append-mode pipeline
quarkus.camel.ai.ingest.products.source.type=file
quarkus.camel.ai.ingest.products.source.directory=${ingest.test.directory}
quarkus.camel.ai.ingest.products.embedding-store=products-store
quarkus.camel.ai.ingest.products.embedding-model=test-model
quarkus.camel.ai.ingest.products.max-segment-size=120
quarkus.camel.ai.ingest.products.max-overlap-size=20

# sync-mode pipeline: edits replace, restarts and unchanged files cost nothing
# (InMemoryEmbeddingStore duplicates on same-id writes, hence remove-then-add)
quarkus.camel.ai.ingest.manuals.source.type=file
quarkus.camel.ai.ingest.manuals.source.directory=${ingest.test.sync-directory}
quarkus.camel.ai.ingest.manuals.embedding-store=manuals-store
quarkus.camel.ai.ingest.manuals.embedding-model=test-model
quarkus.camel.ai.ingest.manuals.mode=sync
quarkus.camel.ai.ingest.manuals.write-strategy=remove-then-add
quarkus.camel.ai.ingest.manuals.embedding-model-id=deterministic-test-model@1
quarkus.camel.ai.ingest.manuals.max-segment-size=120
quarkus.camel.ai.ingest.manuals.max-overlap-size=20
quarkus.camel.ai.ingest.manuals.source.poll-interval=1000
quarkus.camel.ai.ingest.manuals.reconcile.bulk-delete-threshold=0.9

# http-source pipeline: the app itself serves the document (see IngestResource#httpDoc)
quarkus.camel.ai.ingest.webdoc.source.type=http
quarkus.camel.ai.ingest.webdoc.source.url=${test.url:http://localhost:8081}/langchain4j-ingest/http-doc
quarkus.camel.ai.ingest.webdoc.source.poll-interval=1000
quarkus.camel.ai.ingest.webdoc.embedding-store=webdoc-store
quarkus.camel.ai.ingest.webdoc.embedding-model=test-model
quarkus.camel.ai.ingest.webdoc.mode=sync
quarkus.camel.ai.ingest.webdoc.write-strategy=remove-then-add
quarkus.camel.ai.ingest.webdoc.max-segment-size=120
quarkus.camel.ai.ingest.webdoc.max-overlap-size=20
# the app cannot serve its own url before HTTP is up; do not gate readiness on it
quarkus.camel.ai.ingest.webdoc.readiness.enabled=false

# endpoint-source pipeline: the escape hatch — any Camel consumer URI feeds it
quarkus.camel.ai.ingest.custom.source.type=endpoint
quarkus.camel.ai.ingest.custom.source.uri=direct:custom-source
quarkus.camel.ai.ingest.custom.embedding-store=custom-store
quarkus.camel.ai.ingest.custom.embedding-model=test-model
quarkus.camel.ai.ingest.custom.max-segment-size=120
quarkus.camel.ai.ingest.custom.max-overlap-size=20
