#todo try to remove this via profile and use identity
camel.vault.azure.tenantId = ${AZURE_TENANT_ID:placeholderTenantId}
camel.vault.azure.clientId = ${AZURE_CLIENT_ID:placeholderClientId}
camel.vault.azure.clientSecret = ${AZURE_CLIENT_SECRET:placeholderClientSecret}
camel.vault.azure.vaultName = ${AZURE_VAULT_NAME:cq-vault-testing}

camel.vault.azure.refreshEnabled=true
camel.vault.azure.refreshPeriod=1000
camel.vault.azure.secrets=cq-secret-context-refresh.*
camel.vault.azure.eventhubConnectionString=${AZURE_EVENT_HUBS_CONNECTION_STRING:eventhubConnectionString}
camel.vault.azure.blobAccountName=${AZURE_STORAGE_ACCOUNT_NAME:blobStorageAccountName}
camel.vault.azure.blobContainerName=${AZURE_EVENT_HUBS_BLOB_CONTAINER_NAME:blobContainerName}
camel.vault.azure.blobAccessKey=${AZURE_STORAGE_ACCOUNT_KEY:blobAccessKey}
camel.main.context-reload-enabled = true